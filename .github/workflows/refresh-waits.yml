name: Refresh ER waits

on:
  schedule:
    # Offset from the peak :00/:15/:30/:45 minutes — GitHub drops peak-minute
    # schedules most. Each fire starts a marathon run (below).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  # actions: write lets the self-chain step below trigger the next marathon
  # via the workflow_dispatch API using GITHUB_TOKEN.
  actions: write

concurrency:
  group: refresh-waits
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # GitHub's scheduler is best-effort and fires this workflow only a few
    # times a day, so a single run keeps refreshing on a 15-minute loop for
    # up to ~5.5 hours instead of refreshing once. Coverage used to depend on
    # scheduled fires overlapping into near-continuous coverage, but the
    # scheduler twice left a gap after a marathon ended (2026-11-02 and
    # 2026-11-03), so each successful marathon now triggers its own
    # successor (step below); the schedule stays as backup. The concurrency
    # group serializes runs.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh on a loop for up to ~5.5 hours
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # safe_sync: pull latest main, rebasing our local refresh commit(s) on top.
          # If the rebase conflicts, abort it and reset to origin/main so the runner
          # is never left mid-rebase; the local refresh snapshot is discarded and the
          # next cycle re-scrapes fresh Island Health data. Never force-pushes and
          # never overwrites remote history. Returns 0 on a clean sync, 1 if the sync
          # failed but the repo is clean (caller continues); exits the run only if the
          # repo is still mid-rebase after cleanup (unrecoverable -- fail visibly).
          safe_sync() {
            if git pull --rebase origin main; then
              return 0
            fi
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo "::warning::Rebase conflict -- aborting rebase and resetting to origin/main. The local refresh snapshot is discarded; the next cycle re-scrapes fresh Island Health data."
              git rebase --abort || true
              git reset --hard origin/main || true
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                echo "::error::Could not clear the rebase state -- stopping the run so this is visible instead of continuing broken."
                exit 1
              fi
            else
              echo "::warning::git pull failed (network or remote error) -- continuing with local state."
            fi
            return 1
          }

          failed_push_cycles=0
          end=$(( $(date +%s) + 19800 ))
          while :; do
            safe_sync || true
            set +e
            python3 scripts/refresh_waits.py --index index.html > refresh.out 2> refresh.err
            code=$?
            set -e
            cat refresh.err || true
            if [ "$code" -eq 2 ]; then
              echo "::error::Island Health page structure changed (script exit 2) — stopping run so this is visible."
              exit 1
            fi
            if [ "$code" -ne 0 ]; then
              echo "::warning::refresh script exited with code $code (transient source failure) — will retry next cycle."
            elif grep -q '^CHANGED=true' refresh.out; then
              msg=$(grep '^COMMIT_MSG=' refresh.out | sed 's/^COMMIT_MSG=//')
              git add index.html
              git commit -m "$msg"
              # Publish with retries. A transient GitHub-side push failure (e.g. the
              # 2026-11-25 "fatal error in commit_refs_rules") must not kill the
              # marathon or break the self-chain. Retry up to 3 times, 60s apart,
              # re-syncing before each retry. If all retries fail, warn and keep
              # looping -- the next cycle re-scrapes fresh Island Health data and
              # retries. Only a genuine script failure (exit 2) stops the run.
              # Never force-pushes. (RETRY_SLEEP is 60s in production; tests set it
              # to 1s so the retry timing can be exercised quickly.)
              pushed=0
              for attempt in 1 2 3; do
                if git push; then
                  pushed=1
                  break
                fi
                echo "::warning::git push failed (attempt $attempt/3)."
                if [ "$attempt" -eq 3 ]; then
                  break
                fi
                echo "Retrying in ${RETRY_SLEEP:-60}s."
                sleep "${RETRY_SLEEP:-60}"
                safe_sync || true
                # If the re-sync discarded our snapshot (rebase conflict), there is
                # nothing left to push -- stop retrying; the next cycle re-scrapes
                # fresh data.
                ahead=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo -1)
                if [ "$ahead" -eq 0 ]; then
                  echo "::warning::Local refresh snapshot was discarded during re-sync -- nothing to push; the next cycle re-scrapes fresh data."
                  break
                fi
              done
              if [ "$pushed" -eq 0 ]; then
                failed_push_cycles=$((failed_push_cycles + 1))
                echo "::warning::git push failed 3 times this cycle -- keeping the local commit and continuing to the next cycle, which re-scrapes fresh Island Health data."
              fi
            else
              echo "No change this cycle."
            fi
            if [ "$(date +%s)" -ge "$end" ]; then
              echo "Marathon window complete."
              break
            fi
            sleep 900
          done

          # If the marathon ends with unpublished refresh commit(s), the run has
          # failed -- say so loudly instead of reporting success. The self-chain
          # does not fire on failure (by design), and the watchdog will flag the
          # stale page.
          git fetch origin main || true
          unpushed=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo -1)
          if [ "$unpushed" -lt 0 ]; then
            echo "::error::Could not verify the publish state at marathon end (rev-list failed) -- stopping so this is visible."
            exit 1
          fi
          if [ "$unpushed" -gt 0 ]; then
            echo "::error::Marathon ended with $unpushed unpublished refresh commit(s) (push failed in $failed_push_cycles cycle(s)) -- see warnings above. The page may be stale."
            exit 1
          fi

      # Self-chain (added 2026-11-03): after a successful marathon, trigger
      # the next one so coverage no longer depends on GitHub's sparse,
      # best-effort schedule fires. workflow_dispatch events triggered by
      # GITHUB_TOKEN do create new runs (documented exception to the
      # no-recursive-runs rule). Runs only on success: if the refresh loop
      # failed (e.g. Island Health structure change), the chain stops so the
      # failure stays visible instead of looping. A failed dispatch only
      # warns — the schedule backup and the watchdog remain.
      - name: Trigger the next marathon run (self-chain)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/refresh-waits.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$code" = "204" ]; then
            echo "Self-chain dispatch accepted (HTTP 204) — next marathon queued."
          else
            echo "::warning::Self-chain dispatch returned HTTP $code — schedule backup remains; watchdog will flag any resulting gap."
          fi
